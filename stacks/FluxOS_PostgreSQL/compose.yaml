services:
  FluxOS_PostgreSQL:
    image: postgres:17.11-alpine3.23
    container_name: FluxOS_PostgreSQL
    restart: 'no'
    environment:
    - POSTGRES_USER=PsAdmin
    - POSTGRES_PASSWORD=PsFluxOS
    - POSTGRES_DB=fluxos
    - GOSU_VERSION=1.19
    - LANG=en_US.utf8
    - PG_MAJOR=17
    - PG_VERSION=17.11
    - PG_SHA256=dd27f2b3c59e73ed14aa3324901242bf69a032a6347805f274e6260322d42979
    - "DOCKER_PG_LLVM_DEPS=llvm21-dev \t\tclang21"
    - PGDATA=/var/lib/postgresql/data
