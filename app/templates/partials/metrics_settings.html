<div id="metrics-settings" class="bg-[#161e2e] border border-[#232f45] rounded-xl p-5 shadow-xl">
    <div class="flex items-center gap-2.5 mb-4 pb-3 border-b border-[#232f45]">
        <div class="p-1.5 rounded-lg bg-violet-500/10 text-violet-400">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
        </div>
        <div>
            <h2 class="text-base font-semibold text-white">Métricas do servidor</h2>
            <p class="text-xs text-slate-400">Intervalo de atualização e exportação do histórico</p>
        </div>
    </div>

    <form hx-post="/settings/metrics" hx-target="#metrics-settings" hx-swap="outerHTML"
          class="flex flex-wrap items-end gap-3">
        <label class="flex flex-col gap-1 text-xs text-slate-400">
            Intervalo de atualização (segundos)
            <input type="number" name="interval" min="5" max="900" step="1" value="{{ interval }}"
                   class="w-40 bg-[#0f1521] border border-[#232f45] rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-sky-500/60">
        </label>
        <button type="submit"
                class="px-4 py-2 rounded-lg bg-sky-500 hover:bg-sky-400 text-slate-950 text-sm font-semibold transition">
            Salvar
        </button>
        <a href="/metrics/export.csv"
           class="px-4 py-2 rounded-lg bg-[#0f1521] hover:bg-slate-800 border border-[#232f45] text-sm text-slate-200 transition">
            Exportar histórico (CSV)
        </a>
    </form>

    {% if message %}
    <p class="text-sm text-emerald-400 mt-3">{{ message }}</p>
    {% endif %}
    {% if error %}
    <p class="text-sm text-rose-400 mt-3">{{ error }}</p>
    {% endif %}

    <p class="text-xs text-slate-500 mt-4">
        O histórico de longo prazo registra a média de cada período de 5 minutos, sem limite de tempo.
    </p>
</div>
