<div class="rounded-lg border border-[#232f45] bg-[#111722]">
    <div class="px-3.5 py-2.5 border-b border-[#232f45] flex items-center justify-between gap-2">
        <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Nova stack a partir da imagem</h2>
        <span class="font-mono text-[11px] text-sky-400 truncate">{{ image }}</span>
    </div>
    <form hx-post="/docker/create"
          hx-target="#image-detail"
          hx-swap="innerHTML"
          class="p-4 space-y-3">
        <input type="hidden" name="image" value="{{ image }}">

        {% if error %}
        <div class="p-3 rounded-lg bg-red-950/60 border border-red-700/60 text-red-200 text-xs flex items-center gap-2.5">
            <svg class="w-4 h-4 text-red-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <span class="whitespace-pre-line">{{ error }}</span>
        </div>
        {% endif %}

        <div>
            <label for="stack-name" class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-1">Nome da stack</label>
            <input id="stack-name"
                   type="text"
                   name="stack_name"
                   value="{{ stack_name }}"
                   placeholder="minha-stack"
                   class="w-full px-3 py-2 rounded-md bg-[#0f1521] border border-[#232f45] text-xs text-white placeholder-slate-500 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500/30 transition">
        </div>

        <div>
            <label for="compose-content" class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-1">compose.yaml</label>
            <textarea id="compose-content"
                      name="compose_content"
                      rows="14"
                      spellcheck="false"
                      class="w-full px-3 py-2 rounded-md bg-[#0f1521] border border-[#232f45] font-mono text-xs text-emerald-200 leading-relaxed focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500/30 transition">{{ compose_content }}</textarea>
        </div>

        <div>
            <label for="env-content" class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-1">.env (opcional)</label>
            <textarea id="env-content"
                      name="env_content"
                      rows="4"
                      spellcheck="false"
                      placeholder="CHAVE=valor"
                      class="w-full px-3 py-2 rounded-md bg-[#0f1521] border border-[#232f45] font-mono text-xs text-slate-200 leading-relaxed focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500/30 transition">{{ env_content or "" }}</textarea>
        </div>

        <div class="flex items-center justify-end gap-2 pt-1">
            <button type="submit"
                    class="px-4 py-2 rounded-md bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold transition inline-flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                </svg>
                Implantar
            </button>
        </div>
    </form>
</div>
