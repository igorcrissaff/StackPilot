{% if error %}
<div id="container-logs" class="mt-4 p-4 rounded-xl bg-red-950/60 border border-red-700/60 text-red-200 text-xs shadow-lg">
    <div class="flex items-center justify-between mb-2">
        <div class="flex items-center gap-2 font-semibold text-red-300">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            Erro ao carregar logs
        </div>
        <button onclick="document.getElementById('container-logs').outerHTML='<div id=\'container-logs\' class=\'mt-4\'></div>'"
                class="text-xs text-slate-400 hover:text-white px-2.5 py-1 rounded bg-[#0f1521] hover:bg-slate-800 border border-slate-700 transition">
            ✕ Fechar
        </button>
    </div>
    <p class="font-mono text-red-200/90 whitespace-pre-wrap">{{ error }}</p>
</div>
{% else %}
<div id="container-logs" class="mt-4 rounded-xl border border-[#232f45] bg-[#111722] shadow-xl overflow-hidden">
    <!-- Portainer Terminal Header -->
    <div class="flex items-center justify-between px-4 py-2.5 bg-[#0f1521] border-b border-[#232f45]">
        <div class="flex items-center gap-2.5">
            <div class="flex items-center gap-1.5">
                <span class="w-3 h-3 rounded-full bg-red-500/80 inline-block"></span>
                <span class="w-3 h-3 rounded-full bg-amber-500/80 inline-block"></span>
                <span class="w-3 h-3 rounded-full bg-emerald-500/80 inline-block"></span>
            </div>
            <div class="h-4 w-px bg-slate-700 mx-1"></div>
            <span class="text-xs font-mono text-slate-400">
                Log Viewer &gt; <strong class="text-white">{{ container_id }}</strong>
            </span>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="navigator.clipboard.writeText(document.getElementById('log-content').innerText)"
                    class="text-[11px] text-slate-400 hover:text-white px-2 py-1 rounded bg-[#161e2e] hover:bg-slate-800 border border-[#232f45] transition flex items-center gap-1">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/>
                </svg>
                Copiar
            </button>
            <button onclick="document.getElementById('container-logs').outerHTML='<div id=\'container-logs\' class=\'mt-4\'></div>'"
                    class="text-[11px] text-slate-300 hover:text-white px-2.5 py-1 rounded bg-[#161e2e] hover:bg-slate-800 border border-[#232f45] transition">
                ✕ Fechar
            </button>
        </div>
    </div>
    <!-- Terminal Output -->
    <pre id="log-content"
         class="p-4 bg-[#0a0e17] text-slate-200 font-mono text-xs overflow-x-auto max-h-80 leading-relaxed whitespace-pre-wrap select-text">{{ logs if logs else "Nenhum log registrado para este container." }}</pre>
</div>
{% endif %}
