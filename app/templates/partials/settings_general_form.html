<div id="settings-general" class="bg-[#161e2e] border border-[#232f45] rounded-xl p-5 shadow-xl">
    <div class="flex items-center justify-between gap-3 pb-3 mb-4 border-b border-[#232f45]">
        <div>
            <h3 class="text-sm font-semibold text-white">Geral</h3>
            <p class="text-[11px] text-slate-500">Hostname base aplicado às rotas Traefik.</p>
        </div>
        {% if is_custom %}
        <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-sky-500/15 text-sky-400 border border-sky-500/30">Personalizado</span>
        {% else %}
        <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-slate-500/15 text-slate-300 border border-slate-500/30">Padrão do .env</span>
        {% endif %}
    </div>

    {% if message %}
    <div class="mb-3 p-3 rounded-lg bg-emerald-950/60 border border-emerald-700/60 text-emerald-200 text-xs">
        {{ message }}
    </div>
    {% endif %}
    {% if error %}
    <div class="mb-3 p-3 rounded-lg bg-red-950/60 border border-red-700/60 text-red-200 text-xs">
        {{ error }}
    </div>
    {% endif %}

    <form hx-post="/settings" hx-target="#settings-general" hx-swap="outerHTML" class="space-y-3">
        <div>
            <label for="base_domain" class="block text-[11px] font-medium text-slate-400 mb-1">Hostname base</label>
            <input type="text" id="base_domain" name="base_domain" value="{{ base_domain }}" required
                   class="w-full px-3 py-2 rounded-lg bg-[#0f1521] border border-[#232f45] text-white text-xs placeholder-slate-500 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500/30 transition">
            <p class="text-[11px] text-slate-500 mt-1">
                Padrão do ambiente: <span class="font-mono text-slate-400">{{ default_base_domain }}</span>
            </p>
        </div>
        <div class="flex flex-wrap items-center justify-end gap-2 pt-1">
            <button type="submit"
                    class="px-4 py-2 rounded-lg bg-sky-600 hover:bg-sky-500 text-white text-xs font-medium transition shadow-md shadow-sky-600/20">
                Salvar
            </button>
        </div>
    </form>

    <form hx-post="/settings/reset" hx-target="#settings-general" hx-swap="outerHTML" class="mt-3 pt-3 border-t border-[#232f45]">
        <button type="submit"
                class="px-3 py-1.5 rounded-lg bg-[#0f1521] hover:bg-slate-800 border border-[#232f45] text-xs font-medium text-slate-200 transition">
            Restaurar padrão
        </button>
    </form>
</div>
