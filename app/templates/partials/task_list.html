{% if tasks %}
<div class="bg-panel-card border border-panel-border rounded-xl divide-y divide-panel-border">
    {% for task in tasks %}
    <div class="px-4 py-3.5 flex items-center justify-between gap-4">
        <span class="text-sm font-medium text-slate-100">{{ task.title }}</span>
        {% if task.status == "running" %}
        <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-sky-500/15 text-sky-400 border border-sky-500/30">
            <span class="w-1.5 h-1.5 rounded-full bg-sky-400 animate-pulse"></span>
            Em andamento
        </span>
        {% elif task.status == "completed" %}
        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">
            Concluída
        </span>
        {% else %}
        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-rose-500/15 text-rose-400 border border-rose-500/30">
            Falhou
        </span>
        {% endif %}
    </div>
    {% endfor %}
</div>
{% else %}
<div class="bg-panel-card border border-panel-border rounded-xl p-8 text-center text-sm text-slate-400">
    Nenhuma tarefa registrada até o momento.
</div>
{% endif %}
