<tr id="route-row-{{ r.name }}" class="border-b border-sky-500/50 bg-[#162236]/90">
    <td class="py-2.5 px-3 text-white font-medium">
        <div class="flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-sky-400 animate-pulse"></span>
            <span class="font-semibold text-white">{{ r.name }}</span>
        </div>
        <input type="hidden" name="name" value="{{ r.name }}" form="edit-form-{{ r.name }}">
    </td>
    <td class="py-2.5 px-3">
        <div class="flex items-center gap-1">
            <input type="text" name="subdomain" value="{{ r.subdomain }}" required form="edit-form-{{ r.name }}"
                   class="w-full px-2.5 py-1 rounded bg-[#0f1521] border border-sky-500/60 text-xs font-mono text-white focus:outline-none focus:ring-1 focus:ring-sky-500 transition">
            <span class="text-xs font-mono text-slate-400 shrink-0">.{{ base_domain }}</span>
        </div>
    </td>
    <td class="py-2.5 px-3">
        <input type="text" name="target_url" value="{{ r.target_url }}" required form="edit-form-{{ r.name }}"
               class="w-full px-2.5 py-1 rounded bg-[#0f1521] border border-sky-500/60 text-xs font-mono text-white focus:outline-none focus:ring-1 focus:ring-sky-500 transition">
    </td>
    <td class="py-2.5 px-3 text-right whitespace-nowrap">
        <div class="inline-flex items-center gap-1">
            <form id="edit-form-{{ r.name }}" hx-post="/routes" hx-target="#route-list" hx-swap="outerHTML" class="inline">
                <button type="submit" class="px-2.5 py-1 rounded bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-medium transition shadow-sm">
                    Salvar
                </button>
            </form>
            <button hx-get="/routes" hx-target="#route-list" hx-swap="outerHTML"
                    class="px-2.5 py-1 rounded bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-medium transition">
                Cancelar
            </button>
        </div>
    </td>
</tr>
