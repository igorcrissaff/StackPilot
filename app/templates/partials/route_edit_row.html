<tr id="route-row-{{ r.name }}" class="border-b border-sky-800/60 bg-slate-800/40">
    <td class="py-2 text-white font-medium">
        {{ r.name }}
        <input type="hidden" name="name" value="{{ r.name }}" form="edit-form-{{ r.name }}">
    </td>
    <td class="py-2">
        <input type="text" name="domain" value="{{ r.domain }}" required form="edit-form-{{ r.name }}"
               class="w-full px-2 py-1 rounded bg-slate-900 border border-slate-700 text-xs text-white focus:outline-none focus:border-sky-500">
    </td>
    <td class="py-2">
        <input type="text" name="target_url" value="{{ r.target_url }}" required form="edit-form-{{ r.name }}"
               class="w-full px-2 py-1 rounded bg-slate-900 border border-slate-700 text-xs text-white focus:outline-none focus:border-sky-500">
    </td>
    <td class="py-2">
        <label class="inline-flex items-center gap-1 text-xs text-slate-300">
            <input type="checkbox" name="tls" {% if r.tls %}checked{% endif %} form="edit-form-{{ r.name }}" class="rounded bg-slate-900 border-slate-700">
            TLS
        </label>
    </td>
    <td class="py-2 text-right whitespace-nowrap">
        <form id="edit-form-{{ r.name }}" hx-post="/routes" hx-target="#route-list" hx-swap="outerHTML" class="inline">
            <button type="submit" class="px-2 py-1 rounded bg-emerald-700 hover:bg-emerald-600 text-white text-xs font-medium">Salvar</button>
        </form>
        <button hx-get="/routes" hx-target="#route-list" hx-swap="outerHTML"
                class="px-2 py-1 rounded bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs ml-1">Cancelar</button>
    </td>
</tr>
