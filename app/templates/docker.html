{% extends "base.html" %}
{% block content %}
<div class="min-h-screen bg-[#0c1017] text-slate-200">
    <header class="h-16 flex items-center justify-between gap-4 px-5 border-b border-[#232f45] bg-[#0e141f]">
        <div class="flex items-center gap-3">
            <a href="/" class="w-9 h-9 rounded-xl bg-gradient-to-tr from-sky-600 to-cyan-400 p-0.5 flex items-center justify-center shadow-lg shadow-sky-500/10">
                <span class="w-full h-full bg-[#111722] rounded-[10px] flex items-center justify-center">
                    <svg class="w-5 h-5 text-sky-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                        <line x1="12" y1="22.08" x2="12" y2="12"></line>
                    </svg>
                </span>
            </a>
            <div>
                <h1 class="text-sm font-bold text-white leading-tight">Docker</h1>
                <p class="text-[11px] text-slate-500">Imagens e containers do host local</p>
            </div>
        </div>
        <div class="flex items-center gap-3 text-xs">
            <a href="/" class="px-3 py-1.5 rounded-md bg-[#161e2e] border border-[#232f45] text-slate-300 hover:text-white hover:border-sky-500/50 transition">Dashboard</a>
            <span class="text-slate-500 font-mono">{{ user }}</span>
            <form method="post" action="/logout">
                <button type="submit" class="px-3 py-1.5 rounded-md bg-[#161e2e] border border-[#232f45] text-slate-300 hover:text-white hover:border-red-500/50 transition">Sair</button>
            </form>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-5 py-5">
        <div class="flex items-center gap-1 border-b border-[#232f45] mb-5">
            <button type="button"
                    id="tab-images"
                    data-action="docker-tab"
                    data-tab="images"
                    class="px-4 py-2.5 text-xs font-semibold text-sky-400 border-b-2 border-sky-500 transition">
                Images
            </button>
            <button type="button"
                    id="tab-containers"
                    data-action="docker-tab"
                    data-tab="containers"
                    class="px-4 py-2.5 text-xs font-semibold text-slate-400 border-b-2 border-transparent hover:text-white transition">
                Containers
            </button>
        </div>

        <section id="pane-images">
            <div id="image-list">
                {% include "partials/image_list.html" %}
            </div>
            <div id="image-detail" class="mt-4"></div>
        </section>

        <section id="pane-containers" class="hidden">
            <div id="container-list">
                {% with error = containers_error %}
                    {% include "partials/container_list.html" %}
                {% endwith %}
            </div>
            <div id="container-compose" class="mt-4"></div>
            <div id="container-logs" class="mt-4"></div>
        </section>
    </main>
</div>
{% endblock %}
