{% extends "base.html" %}
{% block content %}
<div class="flex flex-col items-center justify-center min-h-screen px-4 bg-gradient-to-br from-[#090d14] via-[#0c1017] to-[#111722]">
    <div class="w-full max-w-md">
        <!-- Logo and Brand Header -->
        <div class="flex flex-col items-center mb-8">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-sky-600 via-cyan-500 to-indigo-500 p-0.5 shadow-xl shadow-sky-500/10 mb-4 flex items-center justify-center">
                <div class="w-full h-full bg-[#111722] rounded-[14px] flex items-center justify-center">
                    <svg class="w-9 h-9 text-sky-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                        <line x1="12" y1="22.08" x2="12" y2="12"></line>
                    </svg>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <h1 class="text-2xl font-bold tracking-tight text-white">StackPilot</h1>
                <span class="px-2 py-0.5 text-[11px] font-semibold uppercase tracking-wider bg-sky-500/10 text-sky-400 border border-sky-500/30 rounded-md">CE</span>
            </div>
            <p class="text-sm text-slate-400 mt-1">Homelab Control Panel & Docker Manager</p>
        </div>

        <!-- Login Card -->
        <div class="bg-[#161e2e] border border-[#232f45] rounded-2xl p-8 shadow-2xl shadow-black/40">
            <div class="mb-6">
                <h2 class="text-lg font-semibold text-white">Autenticação</h2>
                <p class="text-xs text-slate-400 mt-0.5">Entre com suas credenciais de administrador</p>
            </div>

            {% if error %}
            <div class="mb-5 p-3 rounded-lg bg-red-950/60 border border-red-700/60 text-red-200 text-xs flex items-center gap-2.5">
                <svg class="w-4 h-4 text-red-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="post" action="/login" class="space-y-5">
                <div>
                    <label class="block text-xs font-medium uppercase tracking-wider text-slate-300 mb-1.5">Usuário</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                            </svg>
                        </div>
                        <input type="text" name="username" required autofocus placeholder="admin"
                               class="w-full pl-10 pr-4 py-2.5 rounded-lg bg-[#0f1521] border border-[#232f45] text-white text-sm placeholder-slate-500 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500/40 transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium uppercase tracking-wider text-slate-300 mb-1.5">Senha</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                            </svg>
                        </div>
                        <input type="password" name="password" required placeholder="••••••••"
                               class="w-full pl-10 pr-4 py-2.5 rounded-lg bg-[#0f1521] border border-[#232f45] text-white text-sm placeholder-slate-500 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500/40 transition">
                    </div>
                </div>

                <button type="submit"
                        class="w-full py-2.5 px-4 rounded-lg bg-sky-600 hover:bg-sky-500 text-white font-medium text-sm transition shadow-lg shadow-sky-600/25 flex items-center justify-center gap-2">
                    <span>Entrar no Painel</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                    </svg>
                </button>
            </form>
        </div>

        <!-- Footer Info -->
        <div class="mt-6 text-center text-xs text-slate-500 flex items-center justify-center gap-2">
            <span class="inline-block w-2 h-2 rounded-full bg-emerald-500"></span>
            <span>Ambiente local Docker standalone</span>
            <span>•</span>
            <span>Traefik v3</span>
        </div>
    </div>
</div>
{% endblock %}
