{% extends "base.html" %}
{% block content %}
<div class="flex items-center justify-center min-h-screen px-4">
    <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-lg">
        <h1 class="text-2xl font-bold text-white mb-1">StackPilot</h1>
        <p class="text-sm text-slate-400 mb-6">Homelab Control Panel</p>
        {% if error %}
        <div class="mb-4 p-3 rounded bg-red-900/50 border border-red-700 text-red-200 text-sm">
            {{ error }}
        </div>
        {% endif %}
        <form method="post" action="/login" class="space-y-4">
            <div>
                <label class="block text-sm text-slate-300 mb-1">Username</label>
                <input type="text" name="username" required class="w-full px-3 py-2 rounded bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-sky-500">
            </div>
            <div>
                <label class="block text-sm text-slate-300 mb-1">Password</label>
                <input type="password" name="password" required class="w-full px-3 py-2 rounded bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-sky-500">
            </div>
            <button type="submit" class="w-full py-2 px-4 rounded bg-sky-600 hover:bg-sky-500 text-white font-medium">
                Sign In
            </button>
        </form>
    </div>
</div>
{% endblock %}
