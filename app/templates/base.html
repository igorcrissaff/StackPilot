<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StackPilot — Portainer Style Homelab Control Panel</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        portainer: {
                            bg: '#0c1017',
                            sidebar: '#111722',
                            card: '#161e2e',
                            cardHover: '#1c2538',
                            border: '#232f45',
                            borderLight: '#2c3b56',
                            blue: '#0ea5e9',
                            blueDark: '#0284c7',
                            accent: '#38bdf8'
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0c1017;
            color: #e2e8f0;
        }
        /* Custom scrollbar matching Portainer */
        ::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }
        ::-webkit-scrollbar-track {
            background: #0c1017;
        }
        ::-webkit-scrollbar-thumb {
            background: #232f45;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #38bdf8;
        }
        .portainer-glass {
            background: rgba(22, 30, 46, 0.85);
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="bg-portainer-bg text-slate-100 min-h-screen antialiased selection:bg-sky-500 selection:text-white">
    {% block content %}{% endblock %}
</body>
</html>
