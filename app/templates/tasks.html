{% extends "panel_base.html" %}
{% set active_page = 'tasks' %}
{% set page_title = 'Tarefas' %}
{% block panel_content %}
    <main class="flex-1 max-w-4xl w-full mx-auto px-6 py-6">
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-xl font-semibold text-slate-100">Tarefas em Segundo Plano</h1>
                <p class="text-sm text-slate-400 mt-1">Acompanhe o andamento das ações disparadas no painel.</p>
            </div>
        </div>

        <div
            id="task-list-container"
            hx-get="/tasks/list"
            hx-trigger="load, every 2s"
            hx-swap="innerHTML"
        >
            {% include "partials/task_list.html" %}
        </div>
    </main>
{% endblock %}
