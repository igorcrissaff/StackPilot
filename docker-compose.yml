version: "3.9.2"

services:
  stackpilot:
    build: .
    container_name: stackpilot
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./stacks:/opt/stacks
      - ./data:/opt/stackpilot
    networks:
      - internal

networks:
  internal:
    name: stackpilot_net
